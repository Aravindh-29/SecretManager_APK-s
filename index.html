<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SecureNest APK</title>

<style>
:root {
  --primary: #6366f1;
  --secondary: #8b5cf6;
  --bg1: #0f172a;
  --bg2: #020617;
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  background: radial-gradient(circle at top, var(--bg1), var(--bg2));
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e5e7eb;
  padding: 20px;
}

/* MAIN CARD */
.app-card {
  width: 100%;
  max-width: 420px;
  background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
  backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  animation: fadeUp 0.7s ease;
}

/* HEADER */
.app-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}

.app-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 0 10px 25px rgba(99,102,241,0.5);
}

.app-title {
  flex: 1;
}

.app-title h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
}

.app-title p {
  margin: 4px 0 0;
  font-size: 14px;
  color: #c7d2fe;
}

/* TAGLINE */
.app-tagline {
  margin-top: 6px;
  font-size: 13px;
  font-style: italic;
  color: #e0e7ff;
  line-height: 1.4;
}

/* APK ITEM */
.apk-box {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-top: 18px;
}

.apk-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}

.apk-meta {
  font-size: 13px;
  color: #a5b4fc;
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
}

/* BUTTON */
.download-btn {
  display: block;
  width: 100%;
  text-align: center;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  color: white;
  text-decoration: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  box-shadow: 0 15px 35px rgba(99,102,241,0.5);
  transition: all 0.3s ease;
}

.download-btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 25px 50px rgba(139,92,246,0.7);
}

/* FOOTER */
.footer {
  margin-top: 18px;
  font-size: 12px;
  color: #94a3b8;
  text-align: center;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="app-card">

  <div class="app-header">
    <div class="app-icon">🔐</div>
    <div class="app-title">
      <h1>SecureNest</h1>
      <p>Secure Password Vault</p>
      <p class="app-tagline">“Even if you forget, SecureNest will remember.”</p>
    </div>
  </div>

  <div class="apk-box">
    <div class="apk-name">com.securenest.apk</div>

    <div class="apk-meta">
      <span>Version 1.0</span>
      <span>Android 8+</span>
    </div>

    <a class="download-btn"
       href="https://raw.githubusercontent.com/Aravindh-29/SecretManager_APK-s/main/com.securenest.apk"
       download>
      ⬇ Download APK
    </a>
  </div>

  <div class="footer">
    © 2025 SecureNest • Built by Aravindh
  </div>

</div>

</body>
</html>
